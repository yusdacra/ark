name: deploy to server

on:
  push:
  workflow_dispatch:

jobs:
  tag:
    runs-on: lixpine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nix
          key: ${{ runner.os }}-nix-cache
      - uses: https://github.com/cachix/cachix-action@v16
        with:
          name: gazesys-infra
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#nixosConfigurations.wolumonde.config.system.build.toplevel -L --show-trace