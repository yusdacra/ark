kind: Dashboard
metadata:
    name: wolumonde
    createdAt: 0001-01-01T00:00:00Z
    updatedAt: 0001-01-01T00:00:00Z
    version: 0
    project: private-infra
spec:
    panels:
        "0_0":
            kind: Panel
            spec:
                display:
                    name: load over 5 min
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        yAxis:
                            max: 2
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: node_load5
                                seriesNameFormat: load
        "0_1":
            kind: Panel
            spec:
                display:
                    name: cpu usage
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        yAxis:
                            format:
                                unit: percent
                            max: 100
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (cpu) (rate(node_cpu_seconds_total{mode=~"user|system"}[1m])) * 100
                                seriesNameFormat: cpu {{cpu}}
        "0_2":
            kind: Panel
            spec:
                display:
                    name: memory usage
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        yAxis:
                            format:
                                unit: bytes
                            max: 4e+09
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes
                                seriesNameFormat: current memory usage
        "1_0":
            kind: Panel
            spec:
                display:
                    name: nginx requests / min
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        yAxis:
                            format:
                                unit: decimal
                        querySettings:
                            - queryIndex: 0
                              colorMode: fixed
                              colorValue: '#FF0000'
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: nginx_5xx_count
                                seriesNameFormat: 5xx errors
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: nginx_request_count
                                seriesNameFormat: requests
        "1_1":
            kind: Panel
            spec:
                display:
                    name: nginx latency / min
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        yAxis:
                            format:
                                unit: seconds
                            max: 0.5
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: nginx_request_latency
                                seriesNameFormat: '{{stats_result}}'
        "2_0":
            kind: Panel
            spec:
                display:
                    name: pds requests / min
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        yAxis:
                            format:
                                unit: decimal
                        querySettings:
                            - queryIndex: 0
                              colorMode: fixed
                              colorValue: '#FF0000'
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: pds_5xx_count
                                seriesNameFormat: 5xx errors
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: pds_request_count
                                seriesNameFormat: requests
        "2_1":
            kind: Panel
            spec:
                display:
                    name: pds latency / min
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        yAxis:
                            format:
                                unit: milliseconds
                            max: 500
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: pds_response_latency
                                seriesNameFormat: '{{stats_result}}'
        "3_0":
            kind: Panel
            spec:
                display:
                    name: anubis policy actions
                plugin:
                    kind: BarChart
                    spec:
                        calculation: last
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: anubis_policy_results
                                seriesNameFormat: '{{action}}: {{rule}}'
    layouts:
        - kind: Grid
          spec:
            display:
                title: resource usage
            items:
                - x: 0
                  "y": 0
                  width: 6
                  height: 6
                  content:
                    $ref: '#/spec/panels/0_0'
                - x: 6
                  "y": 0
                  width: 6
                  height: 6
                  content:
                    $ref: '#/spec/panels/0_1'
                - x: 12
                  "y": 0
                  width: 6
                  height: 6
                  content:
                    $ref: '#/spec/panels/0_2'
        - kind: Grid
          spec:
            display:
                title: nginx metrics
            items:
                - x: 0
                  "y": 0
                  width: 8
                  height: 6
                  content:
                    $ref: '#/spec/panels/1_0'
                - x: 8
                  "y": 0
                  width: 8
                  height: 6
                  content:
                    $ref: '#/spec/panels/1_1'
        - kind: Grid
          spec:
            display:
                title: pds metrics
            items:
                - x: 0
                  "y": 0
                  width: 8
                  height: 6
                  content:
                    $ref: '#/spec/panels/2_0'
                - x: 8
                  "y": 0
                  width: 8
                  height: 6
                  content:
                    $ref: '#/spec/panels/2_1'
        - kind: Grid
          spec:
            display:
                title: forgejo
            items:
                - x: 0
                  "y": 0
                  width: 8
                  height: 6
                  content:
                    $ref: '#/spec/panels/3_0'
    duration: 30m
    refreshInterval: 1m
