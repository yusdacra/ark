# nvfetcher configuration for Nix flake inputs

[lix-module]
src.manual = "2.93.3-1"
fetch.tarball = "https://git.lix.systems/lix-project/nixos-module/archive/2.93.3-1.tar.gz"

[nixos-wsl]
src.git = "https://github.com/nix-community/NixOS-WSL"
fetch.github = "nix-community/NixOS-WSL"

[disko]
src.git = "https://github.com/nix-community/disko"
fetch.github = "nix-community/disko"

[home]
src.git = "https://github.com/nix-community/home-manager"
fetch.github = "nix-community/home-manager"

[blog]
src.git = "https://tangled.org/@ptr.pet/endpoint"
fetch.git = "https://tangled.org/@ptr.pet/endpoint"

[agenix]
src.git = "https://github.com/ryantm/agenix"
fetch.github = "ryantm/agenix"

[ncr]
src.git = "https://tangled.org/@ptr.pet/nixos-cloud-resources"
fetch.git = "https://tangled.org/@ptr.pet/nixos-cloud-resources"

[limbusart]
src.git = "https://git.gaze.systems/90008/limbusart.git"
fetch.git = "https://git.gaze.systems/90008/limbusart.git"

[clickee-proxy]
src.git = "https://tangled.org/@ptr.pet/clickee-proxy"
fetch.git = "https://tangled.org/@ptr.pet/clickee-proxy"

[nsid-tracker]
src.git = "https://tangled.org/@ptr.pet/nsid-tracker"
fetch.git = "https://tangled.org/@ptr.pet/nsid-tracker"

[tangled]
src.git = "https://tangled.org/@tangled.org/core"
fetch.git = "https://tangled.org/@tangled.org/core"

[tangled-sqlite-lib]
src.manual = "3450100"
fetch.tarball = "https://sqlite.org/2024/sqlite-amalgamation-3450100.zip"

[gomod2nix]
src.git = "https://github.com/nix-community/gomod2nix"
fetch.github = "nix-community/gomod2nix"
